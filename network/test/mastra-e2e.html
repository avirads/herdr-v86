<!doctype html>
<meta charset="utf-8">
<title>Mastra agent e2e</title>
<pre id="serial"></pre>
<pre id="log"></pre>
<div id="screen_container"><div></div><canvas></canvas></div>
<script src="../../libv86-network.js"></script>
<script type="module">
// Real v86, real guest serial bridge, real Mastra agent bundle.
// The LLM is scripted so the run is deterministic — the point of this test is
// the transport and the tool plumbing, not model quality.
//
// Assertions are on GUEST SIDE EFFECTS, never on the agent's text. Mastra
// returns tool-execution errors to the model as tool results, so a broken
// browser polyfill produces a confident, wrong final answer with zero tool
// effects. Checking the text would pass. Checking the guest would not.
import { V86HostBridge } from '../../providers/v86/host-bridge.js';
import { V86GuestAgentClient } from '../../providers/v86/guest-client.js';

const logEl = document.querySelector('#log');
const steps = [];
const log = (message) => { steps.push(message); logEl.textContent = steps.join('\n'); };

let serial = '';
let started = false;
let submitted = false;

const report = (payload) =>
  fetch('/__result', { method: 'POST', body: JSON.stringify({ ...payload, steps, serial: serial.slice(-4000) }) });

setTimeout(() => { if (!submitted) report({ ok: false, error: 'timed out after 180s' }); }, 180_000);

const compat = new URLSearchParams(location.search).get('compat') === '1';
const emulator = new V86({
  wasm_path: '../../v86-network.wasm',
  memory_size: 512 << 20,
  vga_memory_size: 2 << 20,
  bios: { url: '../../seabios.bin' },
  vga_bios: { url: '../../vgabios.bin' },
  bzimage: { url: '../../bzImage-network' },
  cmdline: `root=/dev/sda rw console=ttyS0 tsc=reliable noapic nolapic quiet loglevel=4${compat ? ' libata.force=pio4' : ''}`,
  hda: { url: '../../images/v86/vm-network-ext4.img', async: !compat, size: 100663296 },
  uart1: true,
  screen_container: document.querySelector('#screen_container'),
  autostart: true,
});

const hostBridge = new V86HostBridge(emulator);
hostBridge.setAgentHandler(async () => {});
setInterval(() => hostBridge.send('vmagent-poll').catch(() => {}), 500);
const guest = new V86GuestAgentClient(emulator, hostBridge);

emulator.add_listener('serial0-output-byte', (byte) => {
  serial = (serial + String.fromCharCode(byte)).slice(-100000);
  document.querySelector('#serial').textContent = serial.slice(-4000);

  if (!started && /(?:vm:~#|~\s*[#%])\s*$/.test(serial)) {
    started = true;
    log('shell ready — seeding /root/project');
    emulator.serial0_send(
      "mkdir -p /root/project && cd /root/project && " +
      "printf 'herdr-v86: linux in a browser tab\\n' > README.md && " +
      "echo MASTRA_E2E_SEEDED\n",
    );
  }

  if (!submitted && /\r?\nMASTRA_E2E_SEEDED\r?\n/.test(serial)) {
    submitted = true;
    run().catch((error) => report({ ok: false, error: String(error?.stack || error) }));
  }
});

async function run() {
  log('importing Mastra agent bundle');
  const { createMastraVMAgent } = await import('../../agent/dist/mastra-agent.js');

  // Scripted model: read a file, run a command, write a file, then finish.
  let turn = 0;
  const replies = [
    '{"tool_call":{"name":"mastra_workspace_read_file","arguments":{"path":"/README.md"}}}',
    '{"tool_call":{"name":"mastra_workspace_execute_command","arguments":{"command":"uname -m"}}}',
    '{"tool_call":{"name":"mastra_workspace_write_file","arguments":{"path":"/NOTES.md","content":"arch checked\\n"}}}',
    '{"final":"Read README, checked arch, wrote NOTES.md."}',
  ];
  const llmClient = {
    async chat() {
      const content = replies[turn++] ?? '{"final":"done"}';
      return { choices: [{ index: 0, message: { role: 'assistant', content }, finish_reason: 'stop' }] };
    },
  };

  const vm = createMastraVMAgent({ guest, llmClient, yolo: true });

  const tools = await vm.listTools();
  log(`workspace tools: ${tools.join(', ')}`);

  const started = performance.now();
  const text = await vm.run('Read README.md, check the architecture, write NOTES.md.');
  const elapsedMs = Math.round(performance.now() - started);
  log(`agent finished in ${elapsedMs} ms: ${text}`);

  // --- guest side effects: the only evidence that counts --------------------
  const notes = await guest.read('NOTES.md').catch((error) => `ERROR: ${error.message}`);
  const unameProof = await guest.execute('uname -m');
  // All three agent tiers must be installed in the shipped image. The `vmmastra`
  // command is what makes this tier reachable from the guest shell at all, so
  // a missing one means the image was rebuilt without it.
  const tierCommands = await guest
    .execute(
      'for t in vmlang rig vmmastra vmbench; do command -v $t >/dev/null && echo "$t=ok" || echo "$t=MISSING"; done; ' +
      '! command -v vmagent && echo vmagent=removed || echo vmagent=STALE; ' +
      '! command -v mastra && echo mastra=removed || echo mastra=STALE; ' +
      // The agent-facing operating manual has to survive an image rebuild too;
      // it is the only thing telling an autonomous agent how to verify a run.
      'test -r /usr/local/share/mastra/SKILL.md && echo skill=ok || echo skill=MISSING; ' +
      // The CLI lives in the ext4 image, patched in with debugfs, so it can
      // silently lag the repo whenever someone forgets that step. Prove the
      // booted guest has the batch subcommand rather than trusting the patch.
      'vmmastra --help 2>&1 | grep -q "vmmastra batch" && echo batch=ok || echo batch=MISSING',
    )
    .catch((error) => `ERROR: ${error.message}`);

  const checks = {
    toolsGenerated: tools.length >= 5,
    readFileReachedGuest: /README/.test(serial) || text.length > 0,
    notesWritten: notes === 'arch checked\n',
    modelTurnsUsed: turn,
    guestStillResponsive: /i[3-6]86/.test(unameProof),
    allTiersInstalled:
      /vmlang=ok/.test(tierCommands) && /rig=ok/.test(tierCommands) &&
      /vmmastra=ok/.test(tierCommands) && /vmbench=ok/.test(tierCommands) &&
      /vmagent=removed/.test(tierCommands) && /mastra=removed/.test(tierCommands),
    agentSkillInstalled: /skill=ok/.test(tierCommands),
    batchSubcommandInstalled: /batch=ok/.test(tierCommands),
  };
  const ok =
    checks.toolsGenerated &&
    checks.notesWritten &&
    checks.modelTurnsUsed === 4 &&
    checks.guestStillResponsive &&
    checks.allTiersInstalled &&
    checks.agentSkillInstalled &&
    checks.batchSubcommandInstalled;

  log(`checks: ${JSON.stringify(checks)}`);
  await guest.delete('NOTES.md').catch(() => {});
  await report({ ok, checks, elapsedMs, tools, text, notes });
}
</script>
