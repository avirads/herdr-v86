<!doctype html>
<meta charset="utf-8">
<title>agent tiers — per-feature cost on the real guest</title>
<pre id="serial"></pre>
<pre id="log"></pre>
<div id="screen_container"><div></div><canvas></canvas></div>
<script src="../../libv86-network.js"></script>
<script type="module">
// Per-FEATURE comparison of the three agent tiers against the same real guest.
//
// Each tier's own file layer is driven directly — vmagent's
// V86DeepAgentsBackend, rig's tool dispatch, Mastra's generated workspace
// tools — so this measures the tier, not the model. The model is out of the
// loop entirely here; the aggregate task comparison lives in tier-bench.
//
// The metric that matters is GUEST ROUND-TRIPS. Each one is a real serial
// exchange with an emulated i686; vmbench puts that guest at ~1 s for 100k
// syscalls, so round-trip count dominates wall clock for anything a tier does.
import { V86HostBridge } from '../browser/v86-host-bridge.js';
import { V86GuestAgentClient } from '../browser/v86-guest-readonly.js';

const logEl = document.querySelector('#log');
const steps = [];
const log = (m) => { steps.push(m); logEl.textContent = steps.join('\n'); };

let serial = '';
let seeded = false;
let submitted = false;
const report = (payload) => {
  if (submitted) return;
  submitted = true;
  return fetch('/__result', { method: 'POST', body: JSON.stringify({ ...payload, steps, serial: serial.slice(-2500) }) });
};
setTimeout(() => report({ ok: false, error: 'timed out after 300s' }), 300_000);

const emulator = new V86({
  wasm_path: '../../v86-network.wasm',
  memory_size: 512 << 20,
  vga_memory_size: 2 << 20,
  bios: { url: '../../seabios.bin' },
  vga_bios: { url: '../../vgabios.bin' },
  bzimage: { url: '../../bzImage-network' },
  cmdline: 'root=/dev/sda rw console=ttyS0 tsc=reliable noapic nolapic quiet loglevel=4',
  hda: { url: '../../vm-network-ext4.img', async: true, size: 100663296 },
  uart1: true,
  screen_container: document.querySelector('#screen_container'),
  autostart: true,
});

const hostBridge = new V86HostBridge(emulator);
hostBridge.setAgentHandler(async () => {});
setInterval(() => hostBridge.send('vmagent-poll').catch(() => {}), 500);
const rawGuest = new V86GuestAgentClient(emulator, hostBridge);

let rpc = [];
const guest = new Proxy(rawGuest, {
  get(target, prop) {
    const value = target[prop];
    if (typeof value !== 'function') return value;
    if (!['read', 'write', 'list', 'execute', 'grep', 'glob', 'delete', 'test'].includes(prop)) return value.bind(target);
    return async (...args) => { rpc.push(String(prop)); return value.apply(target, args); };
  },
});

const REPS = Number(new URLSearchParams(location.search).get('reps') || 3);
const median = (xs) => {
  const s = [...xs].sort((a, b) => a - b);
  return s.length % 2 ? s[(s.length - 1) / 2] : Math.round((s[s.length / 2 - 1] + s[s.length / 2]) / 2);
};

// Median of REPS. Single samples on an emulated guest are too noisy to draw a
// recommendation from. `setup` runs untimed so mutating features can be given
// fresh state each rep instead of silently failing on the second one.
async function time(fn, setup) {
  const times = [];
  let rpcCount = 0;
  let trace = '';
  let error = null;
  for (let rep = 0; rep < REPS; rep += 1) {
    try { if (setup) await setup(rep); } catch { /* setup failure surfaces below */ }
    rpc = [];
    const startedAt = performance.now();
    try { await fn(rep); } catch (e) { error ??= String(e?.message || e).slice(0, 80); }
    times.push(Math.round(performance.now() - startedAt));
    rpcCount = rpc.length;
    trace = rpc.join(',');
  }
  return { ms: median(times), all: times, rpc: rpcCount, trace, error };
}

emulator.add_listener('serial0-output-byte', (byte) => {
  serial = (serial + String.fromCharCode(byte)).slice(-80000);
  document.querySelector('#serial').textContent = serial.slice(-2000);
  if (!seeded && /(?:vm:~#|~\s*[#%])\s*$/.test(serial)) {
    seeded = true;
    emulator.serial0_send(
      'mkdir -p /root/project/sub && cd /root/project && ' +
      "printf 'herdr-v86: linux in a browser tab\\nsecond line\\n' > README.md && " +
      "printf 'x\\n' > sub/a.txt && echo FEAT_SEEDED\n",
    );
  }
  if (seeded && /\r?\nFEAT_SEEDED\r?\n/.test(serial) && !window.__started) {
    window.__started = true;
    run().catch((e) => report({ ok: false, error: String(e?.stack || e) }));
  }
});

async function run() {
  log('shell ready — measuring each feature through each tier');

  // --- build each tier's real file layer -----------------------------------
  const { V86DeepAgentsBackend } = await import('../../agent/src/guest-backend.js');
  const vmagent = new V86DeepAgentsBackend(guest, { approve: async () => true, onActivity: () => {} });

  // rig has no object; its dispatch maps a tool name straight to one guest
  // call. Replicated exactly (see runRig in vmagent-controller.js).
  const rig = {
    read: (p) => guest.read(p),
    ls: (p) => guest.list(p || '.'),
    write: (p, c) => guest.write(p, c),
    execute: (c) => guest.execute(c),
  };

  // @mastra/core is only reachable through the bundle, so go in via the
  // harness rather than importing the source directly.
  const { createMastraVMAgent } = await import('../../agent/dist/mastra-agent.js');
  const stubModel = {
    modelName: 'bench',
    async status() { return { modelName: 'bench' }; },
    async chat() { return { choices: [{ message: { content: '{"final":"x"}' } }] }; },
  };
  const mastraVm = createMastraVMAgent({ guest, llmClient: stubModel, yolo: true });
  const mtools = await mastraVm.toolMap();
  const callTool = (name, args) => mtools[name].execute(args, {});

  // --- the features, and how each tier performs them ------------------------
  const features = [
    ['read file', {
      vmagent: () => vmagent.read('/README.md'),
      rig: () => rig.read('README.md'),
      mastra: () => callTool('mastra_workspace_read_file', { path: '/README.md' }),
    }],
    ['list directory', {
      vmagent: () => vmagent.ls('/'),
      rig: () => rig.ls('.'),
      mastra: () => callTool('mastra_workspace_list_files', { path: '/' }),
    }],
    ['write file', {
      vmagent: (r) => vmagent.write(`/w-vm-${r}.txt`, 'hello\n'),
      rig: (r) => rig.write(`w-rig-${r}.txt`, 'hello\n'),
      mastra: (r) => callTool('mastra_workspace_write_file', { path: `/w-ma-${r}.txt`, content: 'hello\n' }),
    }],
    ['run command', {
      vmagent: () => vmagent.execute('uname -m'),
      rig: () => rig.execute('uname -m'),
      mastra: () => callTool('mastra_workspace_execute_command', { command: 'uname -m' }),
    }],
    // Each rep edits a freshly seeded file, so the second rep is not editing
    // a string the first one already replaced.
    ['edit file', {
      vmagent: (r) => vmagent.edit(`/e-vm-${r}.txt`, 'BEFORE', 'AFTER'),
      vmagentSetup: (r) => rawGuest.write(`e-vm-${r}.txt`, 'BEFORE\n'),
      rig: null, // unsupported — rig has no edit tool
      mastra: (r) => callTool('mastra_workspace_edit_file', { path: `/e-ma-${r}.txt`, oldString: 'BEFORE', newString: 'AFTER' }),
      mastraSetup: (r) => rawGuest.write(`e-ma-${r}.txt`, 'BEFORE\n'),
    }],
    ['grep', {
      vmagent: () => vmagent.grep('linux', '/'),
      rig: null, // unsupported
      mastra: () => callTool('mastra_workspace_grep', { pattern: 'linux', path: '/' }),
    }],
    ['file stat', {
      vmagent: null, // no dedicated stat tool
      rig: null,
      mastra: () => callTool('mastra_workspace_file_stat', { path: '/README.md' }),
    }],
    ['mkdir', {
      vmagent: null, // would go through execute
      rig: null,
      mastra: (r) => callTool('mastra_workspace_mkdir', { path: `/d-ma-${r}` }),
    }],
    ['glob', {
      vmagent: () => vmagent.glob('*.md', '/'),
      rig: null,
      mastra: null, // not in the generated workspace tool set
    }],
  ];

  const table = [];
  for (const [feature, impls] of features) {
    const row = { feature };
    for (const tier of ['vmagent', 'rig', 'mastra']) {
      row[tier] = impls[tier] ? await time(impls[tier], impls[`${tier}Setup`]) : { unsupported: true };
    }
    table.push(row);
    const fmt = (r) => (r.unsupported ? '     —' : `${String(r.ms).padStart(4)}ms/${r.rpc}${r.error ? '!' : ''}`);
    log(`${feature.padEnd(16)} vmagent ${fmt(row.vmagent)}   rig ${fmt(row.rig)}   mastra ${fmt(row.mastra)}`);
  }

  // Tool-surface + prompt cost, which is a per-turn cost rather than per-call.
  const lean = mastraVm;
  const full = createMastraVMAgent({ guest, llmClient: stubModel, enableVmTools: true, enablePlanning: true, browserClient: { async command() { return {}; } } });
  const surface = {
    mastraLean: await lean.systemPromptCost(),
    mastraFull: await full.systemPromptCost(),
    rigTools: 4,
    vmagentTools: 18,
  };

  await guest.execute('rm -rf /root/project/w-*.txt /root/project/e-*.txt /root/project/d-ma-*').catch(() => {});
  const ok = table.every((r) => ['vmagent', 'rig', 'mastra'].every((t) => r[t].unsupported || !r[t].error));
  log(ok ? 'all supported features succeeded' : 'some feature errored — see table');
  await report({ ok, checks: { table, surface } });
}
</script>
