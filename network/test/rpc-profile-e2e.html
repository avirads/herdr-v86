<!doctype html>
<meta charset="utf-8">
<title>RPC send: chunked burst integrity + speed</title>
<pre id="serial"></pre><div id="screen_container" hidden><div></div><canvas></canvas></div>
<script src="../../libv86-network.js"></script>
<script type="module">
let serial = '', started = false, submitted = false;
async function submit(ok, reason = '', extra = {}) {
  if (submitted) return; submitted = true;
  await fetch('/__result', { method: 'POST', body: JSON.stringify({ ok, reason, serial: serial.slice(-1500), ...extra }) });
}
// Positional pattern: any dropped/reordered byte changes the read-back.
const pattern = n => { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(33 + (i % 94)); return s; };

const emulator = new V86({
  wasm_path: '../../v86-network.wasm', memory_size: 256 << 20, vga_memory_size: 2 << 20,
  bios: { url: '../../seabios.bin' }, vga_bios: { url: '../../vgabios.bin' }, bzimage: { url: '../../bzImage-network' },
  cmdline: 'root=/dev/sda rw console=ttyS0 tsc=reliable noapic nolapic',
  hda: { url: '../../vm-network-ext4.img', async: true, size: 100663296 }, uart1: true,
  screen_container: document.querySelector('#screen_container'), autostart: true,
});
const { V86HostBridge } = await import('../../providers/v86/host-bridge.js');
const { V86GuestReadonlyClient } = await import('../../providers/v86/guest-client.js');
const hostBridge = new V86HostBridge(emulator, { llmClient: { async chat() { return { choices: [{ message: { content: '' } }] }; } } });
const guest = new V86GuestReadonlyClient(emulator, hostBridge, { timeoutMs: 60000 });

emulator.add_listener('serial0-output-byte', byte => {
  serial = (serial + String.fromCharCode(byte)).slice(-120000);
  document.querySelector('#serial').textContent = serial;
  if (!started && /(?:vm:~#|~\s*[#%])\s*$/.test(serial)) { started = true; run().catch(e => submit(false, e?.stack || e?.message || String(e))); }
});
setTimeout(() => submit(false, 'rpc-profile timed out'), 235000);

async function run() {
  await guest.execute('true').catch(() => {}); // warm
  const N = 4096;                              // payload that took ~29.6 s per-byte
  const content = pattern(N);
  const combos = [[16, 4], [32, 4], [64, 4], [32, 8], [64, 8], [128, 8]];
  const results = [];
  let idx = 0;
  for (const [chunk, delay] of combos) {
    hostBridge.sendChunkBytes = chunk;
    hostBridge.sendChunkDelayMs = delay;
    const path = `c${idx++}.txt`;
    let writeMs = null, lossless = null, msPerByte = null, err = null;
    try {
      const t = performance.now();
      await guest.write(path, content);
      writeMs = +(performance.now() - t).toFixed(0);
      const back = await guest.read(path);
      lossless = back === content;
      msPerByte = +(writeMs / N).toFixed(3);
    } catch (e) { err = e.message; }
    results.push({ chunk, delayMs: delay, writeMs, msPerByte, lossless, err });
  }
  await submit(true, '', { payloadBytes: N, perByteBaselineMs: 29638, perByteMsPerByte: 7.0, sweep: results });
}
</script>
