<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>QuickJS server — vmbro</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<main>
			<h1>Served by QuickJS</h1>
			<p>
				Every request runs <code>server.js</code> fresh inside the guest. Try the route below, then
				edit <code>server.js</code> and click again — no restart.
			</p>
			<button id="call" type="button">GET /api/hello</button>
			<pre id="out" aria-live="polite"></pre>
		</main>
		<script type="module">
			const button = document.getElementById('call');
			const out = document.getElementById('out');

			button.addEventListener('click', async () => {
				out.textContent = '…';
				try {
					const response = await fetch('/api/hello?from=browser');
					out.textContent = `${response.status} ${response.statusText}\n\n${await response.text()}`;
				} catch (error) {
					out.textContent = `Request failed: ${error.message}`;
				}
			});
		</script>
	</body>
</html>
