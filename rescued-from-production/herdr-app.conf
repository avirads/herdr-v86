# Shared herdr-v86 site config, served identically by fapstaff.com and avirads.com.
root /var/www/herdr-v86/current;
index index.html;

location = /app.webmanifest { default_type application/manifest+json; add_header Cache-Control  no-cache; }

location = /ide { return 301 /ide/; }

# Public preview for the single running Dev VM (owner keeps the VMVM tab open).
location /ide/ {
    proxy_pass http://10.77.0.15:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    add_header Cache-Control "no-store";
}

# The scaffolded app server inside the Dev VM runs on its own port; the IDE
# shell embeds it as the live preview iframe at /preview/.
location = /preview { return 301 /preview/; }

location /preview/ {
    proxy_pass http://10.77.0.15:3100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    add_header Cache-Control "no-store";
}

location = /v1/sessions {
    proxy_pass http://127.0.0.1:8086;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
}

location = /v1/ethernet {
    proxy_pass http://127.0.0.1:8086;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location = /plu { return 301 /plu/; }

location /plu/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_redirect ~^/(.*)$ /plu/$1;
    sub_filter_once off;
    sub_filter 'action="/"' 'action="/plu/"';
}

location /peerjs/ {
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}

location = /index.html { add_header Cache-Control "no-cache"; try_files $uri =404; }
location = /service-worker.js { add_header Cache-Control "no-cache"; try_files $uri =404; }

location = /downloads/moonshine-tiny-quantized-0.1.29.zip {
    alias /var/www/herdr-v86-downloads/moonshine-tiny-quantized-0.1.29.zip;
    default_type application/zip;
    add_header Content-Disposition 'attachment; filename="moonshine-tiny-quantized-0.1.29.zip"';
}

location ~ \.mjs$ { default_type application/javascript; try_files $uri =404; }



# --- vmbro CheerpX provider (added for /cx/) --------------------------------
# CheerpX needs SharedArrayBuffer, so this route must be cross-origin isolated.
# Scoped HERE deliberately: COEP on "/" would break the v86 page's PeerJS remote
# chat, the Moonshine voice model and the AutoBro bridge, none of which send CORP.
location /cx/ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}

location = /cx/preview-sw.js {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Service-Worker-Allowed "/cx/" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# HttpBytesDevice streams these over Range and needs Last-Modified/ETag, which
# nginx emits for static files; this block only stays out of the way.
location /images/cheerpx/ {
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    default_type application/octet-stream;
    try_files $uri =404;
}
# --- end vmbro CheerpX provider ---------------------------------------------
location / { try_files $uri $uri/ =404; }
